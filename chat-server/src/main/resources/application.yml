server:
  port: 8080   # Spring Boot 服务端口（REST API 用）
  servlet:
    context-path: /api  # 统一接口前缀，可选
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/chiikawa_chat?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: pipi
    password: 203314wa.
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: ChatHikariCP

  redis:
    lettuce:
      pool:
  data:
    redis:
      host: localhost
      database: 0
      port: 6379
      timeout: 3000

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.tio.chat.entity
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: mySuperSecretKeyForJwt   # JWT 签名密钥（生产环境改成更长的随机字符串）
  expiration: 86400000             # 过期时间 (毫秒) = 1 天
  header: Authorization
  prefix: Bearer

logging:
  level:
    root: INFO
    org.tio.chat: DEBUG
    org.springframework.web.servlet.resource: DEBUG

  file:
    name: logs/chat-server-springboot.log

chat:
  upload:
    local-path: /Users/Zhuanz/Documents/t-io/uploads   # 本地存储路径
    url-prefix: http://172.21.67.11:8080/api/uploads/ # 文件访问URL前缀

